name: ci
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps: [{uses: actions/checkout@v4},{uses: actions/setup-node@v4,with:{node-version: '22'}},{run: npm install},{run: npm run build}]
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: api}}
    steps: [{uses: actions/checkout@v4},{uses: actions/setup-node@v4,with:{node-version: '22'}},{run: npm install},{run: npm test},{run: npm run build}]
  ai:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ai-service}}
    steps: [{uses: actions/checkout@v4},{uses: actions/setup-python@v5,with:{python-version: '3.12'}},{run: pip install -r requirements.txt},{run: pytest -q}]
